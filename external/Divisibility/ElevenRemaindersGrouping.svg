<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1080" viewBox="0 0 1130 1080" role="img" aria-labelledby="title desc">
<title id="title">Grouping 10, 100, and 1000 into groups of 11</title>
<desc id="desc">The first panel shows 10 dots in an eleven-place group, with one empty position: 10 leaves remainder 10 on division by 11 and is one short of a full group. The second panel shows nine complete groups of eleven dots, which make 99, and one extra dot: 100 leaves remainder 1 on division by 11. The third panel shows 90 complete groups of 11 plus 10 remaining dots, one place short of an additional group of 11: 1000 equals 90 times 11 plus 10, or 91 times 11 minus 1.</desc>
<rect width="1130" height="1080" fill="white"/>
<text x="65" y="57" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="650" fill="#203842">How can a remainder of 10 be “one short”?</text>
<text x="65" y="99" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#48636d">Look at groups of 11 when dividing powers of 10.</text>
<rect x="65" y="135" width="1000" height="205" rx="14" fill="#f8fbfa" stroke="#adc4ca" stroke-width="2"/>
<text x="95" y="181" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="650" fill="#203842">10 = 11 − 1</text>
