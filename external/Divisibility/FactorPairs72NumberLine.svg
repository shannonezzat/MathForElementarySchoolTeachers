<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="930" viewBox="0 0 1350 930" role="img" aria-labelledby="title desc">
<title id="title">Factor pairs of 72 on a number line</title>
<desc id="desc">Six horizontal segments on the same number scale connect the factor pairs 1 and 72, 2 and 36, 3 and 24, 4 and 18, 6 and 12, and 8 and 9. The segments nest inward and each crosses a dashed point P between 8 and 9. A close-up shows 8, P, and 9 in order on the line.</desc>
<rect width="1350" height="930" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#203842">
<text x="65" y="59" font-size="38" font-weight="650">Factor pairs of 72</text>
<text x="65" y="101" font-size="23" fill="#48636d">Each segment connects a factor pair on the same number scale.</text>
</g>
