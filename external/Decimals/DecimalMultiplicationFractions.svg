<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="530" viewBox="0 0 1360 530" role="img" aria-labelledby="title desc">
  <title id="title">Multiplying decimals as decimal fractions</title>
  <desc id="desc">Fifty-three point zero seven one times six point two nine equals the product of 53071 over 1000 and 629 over 100. Their product is 53071 times 629 over 1000 times 100, or 33381659 over 100000, which is 333.81659. The factors have three and two decimal places, giving five in the product.</desc>
  <rect width="1360" height="530" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#243640">
    <text x="80" y="59" font-size="26" font-weight="600">Write each factor as a decimal fraction</text>

    <g text-anchor="middle" font-size="31">
      <text x="230" y="182">53.071 × 6.29</text>
      <text x="440" y="182">=</text>
      <text x="625" y="150">53071</text>
      <line x1="549" y1="176" x2="701" y2="176" stroke="#344b55" stroke-width="2.5"/>
      <text x="625" y="223">1000</text>
      <text x="771" y="182">×</text>
      <text x="911" y="150">629</text>
      <line x1="843" y1="176" x2="979" y2="176" stroke="#344b55" stroke-width="2.5"/>
      <text x="911" y="223">100</text>
    </g>
    <g font-size="20" fill="#526f7d" text-anchor="middle">
      <text x="625" y="267">3 decimal places</text>
      <text x="911" y="267">2 decimal places</text>
    </g>

    <line x1="80" y1="292" x2="1280" y2="292" stroke="#d8e1e5" stroke-width="2"/>

    <g text-anchor="middle" font-size="29">
      <text x="275" y="355">53071 × 629</text>
      <line x1="117" y1="381" x2="433" y2="381" stroke="#344b55" stroke-width="2.5"/>
      <text x="275" y="426">1000 × 100</text>

      <text x="502" y="389">=</text>
      <text x="711" y="355">33381659</text>
      <line x1="610" y1="381" x2="812" y2="381" stroke="#344b55" stroke-width="2.5"/>
      <text x="711" y="426">100000</text>

      <text x="865" y="389">=</text>
      <text x="1077" y="389" font-weight="600">333.81659</text>
    </g>
    <text x="711" y="486" font-size="22" fill="#526f7d" text-anchor="middle">3 + 2 = 5 decimal places</text>
  </g>
</svg>
