<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img" aria-labelledby="title desc">
  <title id="title">Adding three copies of one third in decimal notation</title>
  <desc id="desc">A single unit bar is partitioned into three equal thirds. Each third is labelled one third and 0.333 repeating. In fraction notation, one third plus one third plus one third equals one. Beside it, three copies of 0.333 repeating are added vertically to make 0.999 repeating. Therefore 0.999 repeating equals one.</desc>
  <rect width="1180" height="530" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#243640">
    <text x="100" y="87" font-size="23">Three equal parts of the same whole</text>
    <g stroke="#344b55" stroke-width="2">
      <rect x="100" y="150" width="210" height="94" fill="#aecbd8"/>
      <rect x="310" y="150" width="210" height="94" fill="#aecbd8"/>
      <rect x="520" y="150" width="210" height="94" fill="#aecbd8"/>
    </g>
    <g font-size="30" font-weight="600" text-anchor="middle">
      <text x="205" y="210">1/3</text>
      <text x="415" y="210">1/3</text>
      <text x="625" y="210">1/3</text>
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="205" y="293">0.333…</text>
      <text x="415" y="293">0.333…</text>
      <text x="625" y="293">0.333…</text>
    </g>
    <text x="415" y="378" font-size="27" font-weight="600" text-anchor="middle">1/3 + 1/3 + 1/3 = 1</text>

    <line x1="775" y1="73" x2="775" y2="405" stroke="#d8e1e5" stroke-width="2"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="29">
      <text x="880" y="133">0.333…</text>
      <text x="880" y="189">0.333…</text>
      <text x="835" y="245">+</text>
      <text x="880" y="245">0.333…</text>
      <line x1="824" y1="267" x2="1058" y2="267" stroke="#344b55" stroke-width="2.5"/>
      <text x="880" y="316" font-weight="600">0.999…</text>
    </g>
    <line x1="100" y1="427" x2="1080" y2="427" stroke="#d8e1e5" stroke-width="2"/>
    <text x="590" y="488" font-size="32" font-weight="600" text-anchor="middle">0.999… = 1</text>
  </g>
</svg>
