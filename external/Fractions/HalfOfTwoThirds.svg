<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc"><title id="title">One half of two thirds</title><desc id="desc">Three identical rectangles represent the same-sized whole. First, two of three equal vertical strips are shaded. Next, two equal horizontal rows divide the shaded two-thirds into two equal parts. Finally, the top one of those two parts are hatched. The selected region contains two of the whole’s six equal cells, so one half of two thirds is two sixths, or one third.</desc><defs><pattern id="h" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#294e60" stroke-width="1.6"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344b55"/></marker></defs><rect width="1320" height="620" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#243640">
<text x="660" y="48" text-anchor="middle" font-size="32">Taking 1/2 of 2/3</text>
<text x="660" y="91" text-anchor="middle" font-size="23">Each rectangle represents the same whole.</text>
<text x="220" y="145" text-anchor="middle" font-size="23">Start with 2/3</text>
<rect x="70" y="185" width="300" height="250" fill="white"/>
<rect x="70" y="185" width="200" height="250" fill="#dbe7ed"/>
<path d="M170 185v250" stroke="#344b55" stroke-width="2.5"/>
<path d="M270 185v250" stroke="#344b55" stroke-width="2.5"/>
<rect x="70" y="185" width="300" height="250" fill="none" stroke="#344b55" stroke-width="2.5"/>
<path d="M395 310h90" stroke="#344b55" stroke-width="2" marker-end="url(#a)"/>
<text x="220" y="478" text-anchor="middle" font-size="22">2 of 3 equal strips</text>
<text x="660" y="145" text-anchor="middle" font-size="23">Divide it into 2 equal parts</text>
<rect x="510" y="185" width="300" height="250" fill="white"/>
<rect x="510" y="185" width="200" height="250" fill="#dbe7ed"/>
<path d="M510 310h300" stroke="#6a7d87" stroke-width="1.3"/>
<path d="M610 185v250" stroke="#344b55" stroke-width="2.5"/>
<path d="M710 185v250" stroke="#344b55" stroke-width="2.5"/>
<rect x="510" y="185" width="300" height="250" fill="none" stroke="#344b55" stroke-width="2.5"/>
<path d="M835 310h90" stroke="#344b55" stroke-width="2" marker-end="url(#a)"/>
<text x="660" y="478" text-anchor="middle" font-size="22">Each small cell is 1/6</text>
<text x="1100" y="145" text-anchor="middle" font-size="23">Take 1 of those parts</text>
<rect x="950" y="185" width="300" height="250" fill="white"/>
<rect x="950" y="185" width="200" height="250" fill="#dbe7ed"/>
<rect x="950" y="185" width="200" height="125" fill="url(#h)"/>
<path d="M950 310h300" stroke="#6a7d87" stroke-width="1.3"/>
<path d="M1050 185v250" stroke="#344b55" stroke-width="2.5"/>
<path d="M1150 185v250" stroke="#344b55" stroke-width="2.5"/>
<rect x="950" y="185" width="300" height="250" fill="none" stroke="#344b55" stroke-width="2.5"/>
<rect x="950" y="185" width="200" height="125" fill="none" stroke="#243640" stroke-width="3"/>
<text x="1100" y="478" text-anchor="middle" font-size="22">2 of 6 equal cells selected</text>
<text x="660" y="552" text-anchor="middle" font-size="32">1/2 × 2/3 = 2/6 = 1/3</text>
</g></svg>