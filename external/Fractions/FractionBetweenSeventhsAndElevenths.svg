<svg xmlns="http://www.w3.org/2000/svg" width="820" height="402" viewBox="0 0 820 402" role="img" aria-labelledby="title desc"><title id="title">Finding a fraction between five sevenths and eight elevenths</title><desc id="desc">The first scale shows five sevenths and eight elevenths at consecutive ticks, 55 and 56 over 77. Multiplying each fraction by two over two gives equivalent fractions with denominator 154. The same endpoints now read 110 and 112 over 154, and the new tick halfway between reads 111 over 154.</desc><rect width="820" height="402" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#243945" text-anchor="middle"><text x="410" y="31" font-size="22" font-weight="400">Find equivalent fractions with denominator 77.</text><text x="105" y="73" font-size="20" font-weight="400">5</text><path d="M95 79h20" stroke="#243945" stroke-width="1.5"/><text x="105" y="100" font-size="20" font-weight="400">7</text><text x="137" y="86" font-size="21" font-weight="400">=</text><text x="170" y="73" font-size="20" font-weight="400">55</text><path d="M153.5 79h33" stroke="#243945" stroke-width="1.5"/><text x="170" y="100" font-size="20" font-weight="400">77</text><text x="585" y="73" font-size="20" font-weight="400">8</text><path d="M568.5 79h33" stroke="#243945" stroke-width="1.5"/><text x="585" y="100" font-size="20" font-weight="400">11</text><text x="617" y="86" font-size="21" font-weight="400">=</text><text x="650" y="73" font-size="20" font-weight="400">56</text><path d="M633.5 79h33" stroke="#243945" stroke-width="1.5"/><text x="650" y="100" font-size="20" font-weight="400">77</text><path d="M170 123v139 M650 123v139" stroke="#82919a" stroke-width="1.2" stroke-dasharray="4 5" fill="none"/><path d="M98 117H722 M107 113l-9 4 9 4 M713 113l9 4 -9 4" stroke="#344e5b" stroke-width="2"  fill="none"/><path d="M170 108v18 M650 108v18" stroke="#344e5b" stroke-width="2.5"  fill="none"/><path d="M98 267H722 M107 263l-9 4 9 4 M713 263l9 4 -9 4" stroke="#344e5b" stroke-width="2"  fill="none"/><path d="M170 258v18 M650 258v18" stroke="#344e5b" stroke-width="2.5"  fill="none"/><path d="M170 136v7h480v-7" stroke="#344e5b" stroke-width="1.4"  fill="none"/><text x="410" y="166" font-size="18" font-weight="400">The numerators 55 and 56 are consecutive.</text><text x="410" y="210" font-size="18" font-weight="600">Use equivalent fractions with denominator 154.</text><text x="410" y="238" font-size="18" font-weight="400">Multiply each fraction by 2/2.</text><path d="M410 255v24" stroke="#344e5b" stroke-width="3"  fill="none"/><circle cx="410" cy="267" r="4.5" fill="#28596d"/><text x="170" y="299" font-size="20" font-weight="400">110</text><path d="M147 305h46" stroke="#243945" stroke-width="1.5"/><text x="170" y="326" font-size="20" font-weight="400">154</text><text x="410" y="299" font-size="20" font-weight="700">111</text><path d="M387 305h46" stroke="#243945" stroke-width="1.5"/><text x="410" y="326" font-size="20" font-weight="700">154</text><text x="650" y="299" font-size="20" font-weight="400">112</text><path d="M627 305h46" stroke="#243945" stroke-width="1.5"/><text x="650" y="326" font-size="20" font-weight="400">154</text><path d="M170 342v7h240v-7 M410 342v7h240v-7" stroke="#344e5b" stroke-width="1.4"  fill="none"/><text x="290" y="376" font-size="18" font-weight="400">1/154</text><text x="530" y="376" font-size="18" font-weight="400">1/154</text></g></svg>
