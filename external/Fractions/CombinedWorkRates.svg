<pattern id="pb" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#edd6b7"/><circle cx="5" cy="5" r="1.2" fill="#96754a"/></pattern>
<pattern id="pc" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d1dfcb"/><path d="M0 5 H10" stroke="#6e8565" stroke-width="0.8"/></pattern>
