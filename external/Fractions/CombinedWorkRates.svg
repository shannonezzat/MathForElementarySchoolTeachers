<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Adding work completed in one hour</title><desc id="desc">Four identical bars each represent one job and contain twenty equal cells. A completes five cells, B four cells, and C two cells in one hour. Together they complete eleven of twenty cells per hour, so one job takes twenty elevenths of an hour.</desc>
