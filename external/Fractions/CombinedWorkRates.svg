<text x="695" y="505" text-anchor="middle" font-size="18" font-weight="normal">C: 2</text>
<text x="887.5" y="505" text-anchor="middle" font-size="18" font-weight="normal">9 cells remain</text>
<text x="600" y="558" text-anchor="middle" font-size="25" font-weight="normal">Combined rate: 1/4 + 1/5 + 1/10 = 11/20 job per hour</text>
<text x="600" y="606" text-anchor="middle" font-size="25" font-weight="bold">Time for one job: 1 ÷ (11/20) = 20/11 hours</text>
<text x="600" y="650" text-anchor="middle" font-size="18" font-weight="normal">Assume constant individual rates that add when the people work together.</text>
