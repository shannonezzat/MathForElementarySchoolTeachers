<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Combining fuel consumption and price</title>
<desc id="desc">A trip of 250 kilometres uses 20 litres at 8 litres per 100 kilometres. At 3 dollars per 2 litres, the fuel costs 30 dollars. In the combined calculation, kilometre and litre units cancel, leaving dollars.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34474f"/></marker></defs>
<rect width="1200" height="500" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#24343c">
<text x="600" y="40" text-anchor="middle" font-size="29" font-weight="bold">Combining fuel consumption and price</text>
<text x="145" y="187" text-anchor="middle" font-size="20" font-weight="normal">Distance</text>
<rect x="40" y="206" width="210" height="68" rx="3" fill="#e5eff3" stroke="#536e7a" stroke-width="1.5"/>
<text x="145" y="250" text-anchor="middle" font-size="28" font-weight="bold">250 km</text>
<text x="600" y="187" text-anchor="middle" font-size="20" font-weight="normal">Fuel needed</text>
<rect x="495" y="206" width="210" height="68" rx="3" fill="#e5eff3" stroke="#536e7a" stroke-width="1.5"/>
<text x="600" y="250" text-anchor="middle" font-size="28" font-weight="bold">20 litres</text>
<text x="1055" y="187" text-anchor="middle" font-size="20" font-weight="normal">Fuel cost</text>
<rect x="950" y="206" width="210" height="68" rx="3" fill="#e5eff3" stroke="#536e7a" stroke-width="1.5"/>
<text x="1055" y="250" text-anchor="middle" font-size="28" font-weight="bold">30 dollars</text>
<text x="372.5" y="96" text-anchor="middle" font-size="20" font-weight="normal">Multiply by</text>
<text x="372.5" y="131" text-anchor="middle" font-size="23" font-weight="normal">8 litres</text>
<line x1="302.5" y1="141" x2="442.5" y2="141" stroke="#34474f" stroke-width="1.5" />
<text x="372.5" y="169" text-anchor="middle" font-size="23" font-weight="normal">100 km</text>
<line x1="270" y1="240" x2="475" y2="240" stroke="#34474f" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="827.5" y="96" text-anchor="middle" font-size="20" font-weight="normal">Multiply by</text>
<text x="827.5" y="131" text-anchor="middle" font-size="23" font-weight="normal">3 dollars</text>
<line x1="757.5" y1="141" x2="897.5" y2="141" stroke="#34474f" stroke-width="1.5" />
<text x="827.5" y="169" text-anchor="middle" font-size="23" font-weight="normal">2 litres</text>
<line x1="725" y1="240" x2="930" y2="240" stroke="#34474f" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="60" y1="305" x2="1140" y2="305" stroke="#c7d2d7" stroke-width="1" />
<text x="600" y="339" text-anchor="middle" font-size="21" font-weight="bold">In one calculation</text>
<text x="145" y="401" text-anchor="middle" font-size="27" font-weight="normal">250</text>
<text x="206" y="401" text-anchor="middle" font-size="27" font-weight="normal">km</text>
<line x1="186" y1="408" x2="226" y2="376" stroke="#6a7c84" stroke-width="1.3" />
<text x="274" y="401" text-anchor="middle" font-size="29" font-weight="normal">×</text>
<text x="375" y="380" text-anchor="middle" font-size="26" font-weight="normal">8</text>
<text x="436" y="380" text-anchor="middle" font-size="26" font-weight="normal">litres</text>
<line x1="400" y1="387" x2="472" y2="355" stroke="#6a7c84" stroke-width="1.3" />
<line x1="338" y1="390" x2="486" y2="390" stroke="#34474f" stroke-width="1.5" />
<text x="375" y="424" text-anchor="middle" font-size="26" font-weight="normal">100</text>
<text x="445" y="424" text-anchor="middle" font-size="26" font-weight="normal">km</text>
<line x1="425" y1="431" x2="465" y2="399" stroke="#6a7c84" stroke-width="1.3" />
<text x="533" y="401" text-anchor="middle" font-size="29" font-weight="normal">×</text>
<text x="661" y="380" text-anchor="middle" font-size="26" font-weight="normal">3 dollars</text>
<line x1="589" y1="390" x2="733" y2="390" stroke="#34474f" stroke-width="1.5" />
<text x="622" y="424" text-anchor="middle" font-size="26" font-weight="normal">2</text>
<text x="682" y="424" text-anchor="middle" font-size="26" font-weight="normal">litres</text>
<line x1="646" y1="431" x2="718" y2="399" stroke="#6a7c84" stroke-width="1.3" />
<text x="789" y="401" text-anchor="middle" font-size="29" font-weight="normal">=</text>
<text x="960" y="401" text-anchor="middle" font-size="29" font-weight="bold">30 dollars</text>
<text x="600" y="476" text-anchor="middle" font-size="20" font-weight="normal">Kilometres cancel, then litres cancel; the remaining unit is dollars.</text>
</g></svg>