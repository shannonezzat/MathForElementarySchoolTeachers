<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Choosing the prime factors of a divisor of 144</title>
<desc id="desc">The number 144 equals 2 to the fourth power times 3 squared. A grid of three rows and five columns lists all fifteen divisors. Columns choose zero through four copies of 2; rows choose zero through two copies of 3. Selecting three 2s and one 3 gives 24.</desc>
<rect width="1200" height="760" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#203842">
<text x="65" y="58" font-size="38" font-weight="650">How many factors does 144 have?</text>
<text x="65" y="100" font-size="23" fill="#45616b">144 = 2⁴ × 3². Choose a number of 2s and a number of 3s.</text>
<text x="708" y="165" text-anchor="middle" font-size="24" font-weight="600">Five choices for the number of 2s</text>
</g>
<rect x="137" y="190" width="1015" height="390" rx="10" fill="#fff" stroke="#aebfc5" stroke-width="2.5"/>
