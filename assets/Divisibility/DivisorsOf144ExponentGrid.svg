<text x="65" y="638" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" fill="#203842"><tspan font-weight="650">One example:</tspan> 2³ × 3¹ = 24</text>
<text x="65" y="699" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#203842"><tspan font-weight="650">Total:</tspan> 5 choices × 3 choices = <tspan font-weight="700">15 factors</tspan></text>
