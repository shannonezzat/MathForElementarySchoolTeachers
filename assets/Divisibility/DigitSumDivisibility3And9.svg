<text x="737" y="187" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="650" fill="#203842">Single units left over</text>
<text x="90" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#203842">3 × 1000</text>
<text x="370" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#203842">3 × 999</text>
