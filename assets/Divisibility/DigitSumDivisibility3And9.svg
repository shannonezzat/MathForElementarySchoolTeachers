<text x="65" y="609" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="650" fill="#203842">3 + 4 + 5 + 6 = 18 = 2 × 9</text>
<text x="65" y="646" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#48636d">The single units form two groups of 9:</text>
<rect x="670" y="592" width="116" height="116" rx="12" fill="#f7fbfa" stroke="#adc4ca" stroke-width="2"/>
