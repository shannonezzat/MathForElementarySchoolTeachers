<text x="814" y="664" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="650" fill="#203842" text-anchor="middle">+</text>
<text x="65" y="741" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#365965">All the other parts are also divisible by 9, so 3456 is divisible by 9 and by 3.</text>
</svg>