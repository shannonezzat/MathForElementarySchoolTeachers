<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="780" viewBox="0 0 1130 780" role="img" aria-labelledby="title desc">
<title id="title">Why the digit sum tests divisibility by 3 and 9</title>
<desc id="desc">The place values in 3456 are split into multiples of nine and single units: 3 times 1000 equals 3 times 999 plus 3; 4 times 100 equals 4 times 99 plus 4; 5 times 10 equals 5 times 9 plus 5; and 6 equals 0 plus 6. The multiples-of-nine parts total 3438. The leftover units total 3 plus 4 plus 5 plus 6 equals 18, illustrated as two groups of nine dots. Thus 3456 is divisible by 9 and by 3.</desc>
<rect width="1130" height="780" fill="white"/>
<text x="65" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="650" fill="#203842">Why does the sum of the digits work?</text>
<text x="65" y="101" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#48636d">For 3456, split each place value into a multiple of 9 and single units.</text>
<rect x="65" y="145" width="1000" height="397" rx="14" fill="#fff" stroke="#adc4ca" stroke-width="2"/>
