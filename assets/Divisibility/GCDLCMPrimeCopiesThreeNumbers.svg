<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1050" viewBox="0 0 1520 1050" role="img" aria-labelledby="title desc">
<title id="title">Prime factor copies for the GCD and LCM of 42, 294, and 132</title>
<desc id="desc">Aligned factor-copy circles show 42 with 2, 3, 7; 294 with 2, 3, 7, 7; and 132 with 2, 2, 3, 11. The common 2 and 3 circles are green in each number and in the GCD row. All circles appearing in any number reappear in their corresponding positions in the LCM row. Therefore GCD 6 and LCM 6468.</desc>
<rect width="1520" height="1050" fill="#ffffff"/>
<g font-family="DejaVu Sans, Arial, sans-serif" fill="#203842">
<text x="95" y="67" font-size="39" font-weight="600">Which prime factors do we need?</text>
<text x="95" y="112" font-size="23" fill="#48636d">Compare the prime factors of 42, 294, and 132 one prime at a time.</text>
</g>
<rect x="92" y="159" width="1350" height="674" rx="9" fill="#ffffff" stroke="#adc4ca" stroke-width="2.5"/>
