<rect x="93" y="600" width="1348" height="120" fill="#eef5f2"/>
<rect x="93" y="721" width="1348" height="111" fill="#faf2df"/>
<g stroke="#c5d4d8" stroke-width="1.6">
<path d="M360 159v674 M620 159v674 M880 159v674 M1140 159v674"/>
<path d="M92 240h1350 M92 360h1350 M92 470h1350 M92 580h1350 M92 600h1350 M92 720h1350"/>
</g>
