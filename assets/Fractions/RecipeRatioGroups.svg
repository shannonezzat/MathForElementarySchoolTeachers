<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">A recipe in the ratio two to five</title>
<desc id="desc">Four complete recipe groups each contain two cups of concentrate and five cups of water. A final group is one fifth as large: two fifths of a cup of concentrate and one cup of water. All rectangles use the same area per cup. Together these give eight and two fifths cups of concentrate and twenty-one cups of water.</desc>
