<text x="750" y="48" text-anchor="middle" font-size="30" font-weight="bold">Every recipe group has concentrate : water = 2 : 5</text>
<text x="750" y="89" text-anchor="middle" font-size="22">Each full small rectangle represents 1 cup.</text>
