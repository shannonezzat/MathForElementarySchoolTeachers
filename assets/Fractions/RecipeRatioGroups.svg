<text x="750" y="548" text-anchor="middle" font-size="25" font-weight="bold">Each group keeps the same 2 : 5 ratio.</text>
<text x="750" y="603" text-anchor="middle" font-size="25">Water: 5 + 5 + 5 + 5 + 1 = 21 cups</text>
<text x="750" y="652" text-anchor="middle" font-size="25">Concentrate: 2 + 2 + 2 + 2 + ⅖ = 8 ⅖ cups</text>
