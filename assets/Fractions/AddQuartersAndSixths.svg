<svg xmlns="http://www.w3.org/2000/svg" width="824" height="246" viewBox="0 0 824 246"><title>Adding three quarters and five sixths</title><desc>Nine hatched twelfths and ten dotted twelfths fill one whole bar and seven twelfths of another. Three dotted twelfths complete the first bar.</desc><defs><pattern id="a" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#dce8ec"/><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" stroke="#547386"/></pattern><pattern id="b" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f4eadb"/><circle cx="3.5" cy="3.5" r="1.2" fill="#77654d"/></pattern></defs><rect width="824" height="246" fill="white"/><g fill="#243945" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="23"><text x="200" y="33">3 quarters = 9 twelfths</text><text x="624" y="33">5 sixths = 10 twelfths</text><rect x="32" y="50" width="28" height="42" fill="url(#a)"/><rect x="60" y="50" width="28" height="42" fill="url(#a)"/><rect x="88" y="50" width="28" height="42" fill="url(#a)"/><rect x="116" y="50" width="28" height="42" fill="url(#a)"/><rect x="144" y="50" width="28" height="42" fill="url(#a)"/><rect x="172" y="50" width="28" height="42" fill="url(#a)"/><rect x="200" y="50" width="28" height="42" fill="url(#a)"/><rect x="228" y="50" width="28" height="42" fill="url(#a)"/><rect x="256" y="50" width="28" height="42" fill="url(#a)"/><rect x="284" y="50" width="28" height="42" fill="white"/><rect x="312" y="50" width="28" height="42" fill="white"/><rect x="340" y="50" width="28" height="42" fill="white"/><path d="M60 50v42" stroke="#344e5b" stroke-width="1" stroke-dasharray="3 3"/><path d="M88 50v42" stroke="#344e5b" stroke-width="1" stroke-dasharray="3 3"/><path d="M116 50v42" stroke="#344e5b" stroke-width="2.5" /><path d="M144 50v42" stroke="#344e5b" stroke-width="1" stroke-dasharray="3 3"/><path d="M172 50v42" stroke="#344e5b" stroke-width="1" stroke-dasharray="3 3"/><path d="M200 50v42" stro