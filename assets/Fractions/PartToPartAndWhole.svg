<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Part-to-part and part-to-whole ratios</title><desc id="desc">Four equal groups each contain three apples and two oranges, making twelve apples and eight oranges altogether. An enlarged group illustrates the apple-to-orange ratio of three to two and apple-to-all-fruit ratio of three to five.</desc><defs>
<g id="apple"><path d="M0 -11 C-9 -22 -23 -10 -20 3 C-18 19 -8 23 0 18 C8 23 18 19 20 3 C23 -10 9 -22 0 -11 Z" fill="#bdd8c1" stroke="#344d3b" stroke-width="1.5"/><path d="M0 -12 Q-2 -21 3 -25 M2 -19 Q16 -28 15 -17 Q8 -12 2 -19" fill="#8fb296" stroke="#344d3b" stroke-width="1.5"/><text x="0" y="9" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#24372a">A</text></g>
<g id="orange"><circle r="20" fill="#efd4ad" stroke="#725a35" stroke-width="1.5"/><text x="0" y="7" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#584326">O</text></g></defs><rect width="1200" height="650" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#25343c">
<text x="600" y="42" text-anchor="middle" font-size="29" font-weight="bold">Part-to-part and part-to-whole ratios</text>
<text x="320" y="92" text-anchor="middle" font-size="23" font-weight="bold">The whole collection: 20 fruits</text>
<rect x="65" y="115" width="510" height="330" rx="4" fill="none" stroke="#34474f" stroke-width="2"/>
<rect x="98" y="130" width="204" height="130" rx="4" fill="none" stroke="#a5afb2" stroke-width="1"/>
<g transform="translate(200 170) scale(1)">
<use href="#apple" x="-55" y="0"/>
<use href="#apple" x="0" y="0"/>
<use href="#apple" x="55" y="0"/>
<use href="#orange" x="-27.5" y="61"/>
<use href="#orange" x="27.5" y="61"/>
</g>
<rect x="338" y="130" width="204" height="130" rx="4" fill="none" stroke="#a5afb2" stroke-width="1"/>
<g transform="translate(440 170) scale(1)">
<use href="#apple" x="-55" y="0"/>
<use href="#apple" x="0" y="0"/>
<use href="#apple" x="55" y="0"/>
<use href="#orange" x="-27.5" y="61"/>
<use href="#orange" x="27.5" y="61"/>
</g>
<rect x="98" y="290" width="204" height="130" rx="4" fill="none" stroke="#a5afb2" stroke-width="1"/>
<g transform="translate(200 330) scale(1)">
<use href="#apple" x="-55" y="0"/>
<use href="#apple" x="0" y="0"/>
<use href="#apple" x="55" y="0"/>
<use href="#orange" x="-27.5" y="61"/>
<use href="#orange" x="27.5" y="61"/>
</g>
<rect x="338" y="290" width="204" height="130" rx="4" fill="none" stroke="#a5afb2" stroke-width="1"/>
<g transform="translate(440 330) scale(1)">
<use href="#apple" x="-55" y="0"/>
<use href="#apple" x="0" y="0"/>
<use href="#apple" x="55" y="0"/>
<use href="#orange" x="-27.5" y="61"/>
<use href="#orange" x="27.5" y="61"/>
</g>
<text x="320" y="480" text-anchor="middle" font-size="23" font-weight="normal">12 apples and 8 oranges</text>
<text x="890" y="92" text-anchor="middle" font-size="23" font-weight="bold">One equal group, enlarged</text>
<rect x="735" y="115" width="310" height="240" rx="4" fill="none" stroke="#34474f" stroke-width="2"/>
<g transform="translate(890 185) scale(1.5)">
<use href="#apple" x="-55" y="0"/>
<use href="#apple" x="0" y="0"/>
<use href="#apple" x="55" y="0"/>
<use href="#orange" x="-27.5" y="61"/>
<use href="#orange" x="27.5" y="61"/>
</g>
<text x="890" y="395" text-anchor="middle" font-size="23" font-weight="normal">Apples : oranges = 3 : 2</text>
<text x="890" y="434" text-anchor="middle" font-size="23" font-weight="normal">Apples : all fruit = 3 : 5</text>
<text x="600" y="542" text-anchor="middle" font-size="25" font-weight="bold">Part-to-part: 12 : 8 = 3 : 2</text>
<text x="600" y="587" text-anchor="middle" font-size="25" font-weight="bold">Part-to-whole: 12 : 20 = 3 : 5</text>
<text x="600" y="628" text-anchor="middle" font-size="18" font-weight="normal">A = apple     O = orange</text>
</g></svg>