<text x="345" y="542" font-size="24">One complete group holds ⅘ = 12/15.</text>
<text x="230" y="592" font-size="26">We can make 10/12 = ⅚ of one group.</text>
<text x="410" y="638" font-size="28">⅔ ÷ ⅘ = ⅚</text>
