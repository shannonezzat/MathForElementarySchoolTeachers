<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Divide two thirds into groups of four fifths</title><desc id="desc">A whole is fifteen equal cells. The available amount, two thirds, is ten cells. One complete group must contain four fifths, or twelve cells. Placing all ten available cells in a twelve-cell group outline fills ten twelfths, or five sixths, of one group. Two empty dashed cells show the shortfall.</desc><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#52788b" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#23343d"/></marker></defs><rect width="1200" height="660" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#23343d">
<text x="150" y="45" font-size="30">Divide ⅔ into groups with ⅘ in each group</text>
<text x="230" y="95" font-size="22">Each small cell represents 1/15 of a whole.</text>
