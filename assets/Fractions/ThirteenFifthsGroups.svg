<text x="650" y="545" font-size="25" text-anchor="middle">Each complete group holds 4 fifths.</text>
<text x="650" y="603" font-size="31" text-anchor="middle">13/5 ÷ 4/5 = 13 ÷ 4 = 3¼</text>
