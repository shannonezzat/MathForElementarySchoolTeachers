<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc"><title id="title">Thirteen fifths divided into groups of four fifths</title><desc id="desc">A whole is five equal cells. Thirteen fifths is thirteen cells, shown first as two wholes and three fifths. Regrouping those same thirteen cells into groups of four gives three complete groups and one of the four cells needed for a fourth group. Thus thirteen fifths divided by four fifths equals three and one quarter.</desc><defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#52788b" stroke-width="1"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#243640"/></marker></defs><rect width="1300" height="650" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#243640">
<text x="650" y="44" font-size="30" text-anchor="middle">Divide 13/5 into groups with 4/5 in each group</text>
<text x="650" y="86" font-size="23" text-anchor="middle">Every small cell represents 1/5 of the same-sized whole.</text>
